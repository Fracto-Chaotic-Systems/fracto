name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-admin-server
          path: servers/fracto-admin-server
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-ai-server
          path: servers/fracto-ai-server
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-asset-server
          path: servers/fracto-asset-server
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-data-server
          path: servers/fracto-data-server
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-tiles-server
          path: servers/fracto-tiles-server
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fracto-ui
          path: servers/fracto-ui
          token: ${{ secrets.FRACTO_SERVICES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix servers/fracto-admin-server
      - run: npm ci --prefix servers/fracto-ai-server
      - run: npm ci --ignore-scripts --prefix servers/fracto-asset-server
      - run: npm ci --prefix servers/fracto-data-server
      - run: npm ci --prefix servers/fracto-tiles-server
      - run: npm ci --prefix servers/fracto-ui
      - run: npm run sdk:check
      - run: npm run check:app-reference
      - run: npm run check
      - name: Check UI and data numerical contracts
        run: >-
          node --test --test-concurrency=4
          servers/fracto-ui/test/seed_survey_detect.test.js
          servers/fracto-data-server/tests/handle_orbitals.test.js
          servers/fracto-data-server/tests/seed_survey_half_span.test.js
          servers/fracto-data-server/tests/orbital_data.test.js
          servers/fracto-data-server/tests/orbital_pipeline_stages.test.js
          servers/fracto-data-server/tests/worker_task_pool.test.js
      - run: npm run check --prefix servers/fracto-ai-server
