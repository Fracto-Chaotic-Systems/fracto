services:
  fracto:
    build:
      context: .
      args:
        VITE_FRACTO_PROD_URL: ${FRACTO_PROD_URL:-https://fracto.mikehallstudio.com}
    image: fracto:local
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"
      - "3006:3006"
    volumes:
      - ./config:/app/config:ro
      - fracto-tile-data:/var/lib/fracto/tiles
      - fracto-tile-index:/var/lib/fracto/index
      - fracto-assets:/app/assets
      - fracto-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  index-refresh:
    image: fracto:local
    profiles: ["maintenance"]
    command: ["npm", "run", "tiles:refresh"]
    volumes:
      - ./config:/app/config:ro
      - fracto-tile-index:/var/lib/fracto/index
    restart: "no"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  tile-cache-migrate:
    image: fracto:local
    profiles: ["maintenance"]
    command: ["sh", "scripts/migrate_tile_cache.sh", "/legacy-tiles", "/var/lib/fracto/tiles"]
    volumes:
      - ./tiles:/legacy-tiles
      - fracto-tile-data:/var/lib/fracto/tiles
    restart: "no"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  fracto-tile-data:
  fracto-tile-index:
  fracto-assets:
  fracto-logs:
