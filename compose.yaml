services:
  fracto:
    build:
      context: .
      args:
        VITE_FRACTO_PROD_URL: ${FRACTO_PROD_URL:-https://fracto.mikehallstudio.com}
    image: fracto:local
    environment:
      FRACTO_SERVER_NAME: ${FRACTO_SERVER_NAME:-}
      FRACTO_AI_ENGINE: ${FRACTO_AI_ENGINE:-ollama}
      FRACTO_AI_DATA_DIR: /var/lib/fracto/ai
      FRACTO_DATA_CORRECTION_DIR: /var/lib/fracto/data-corrections
      FRACTO_AI_PEERS_ENABLED: ${FRACTO_AI_PEERS_ENABLED:-true}
      FRACTO_AI_PEER_LISTEN_HOST: "0.0.0.0"
      FRACTO_AI_PEER_PORT: "3447"
      FRACTO_AI_LISTEN_HOST: "0.0.0.0"
      FRACTO_AI_MIN_FREE_MEMORY_MIB: ${FRACTO_AI_MIN_FREE_MEMORY_MIB:-6144}
      FRACTO_AI_MIN_FREE_DISK_MIB: ${FRACTO_AI_MIN_FREE_DISK_MIB:-1024}
      FRACTO_AI_MODEL: ${FRACTO_AI_MODEL:-}
      FRACTO_OLLAMA_URL: ${FRACTO_OLLAMA_URL:-http://host.docker.internal:11434}
      FRACTO_OLLAMA_ALLOW_HOST_GATEWAY: "true"
      FRACTO_SURVEY_MAX_GRID_SIZE: ${FRACTO_SURVEY_MAX_GRID_SIZE:-1024}
      FRACTO_SURVEY_MAX_CANVAS_SIZE: ${FRACTO_SURVEY_MAX_CANVAS_SIZE:-16384}
      FRACTO_MYSQL_HOST: ${FRACTO_MYSQL_HOST:-host.docker.internal}
      FRACTO_MYSQL_PORT: ${FRACTO_MYSQL_PORT:-3306}
      FRACTO_SOCIAL_SYNC_TTL_MS: ${FRACTO_SOCIAL_SYNC_TTL_MS:-86400000}
      FRACTO_AUTH_MODE: ${FRACTO_AUTH_MODE:-oidc}
      FRACTO_AUTH_REQUIRED: ${FRACTO_AUTH_REQUIRED:-false}
      FRACTO_INTERNAL_SERVICE_TOKEN: ${FRACTO_INTERNAL_SERVICE_TOKEN:-}
      FRACTO_ADMIN_READONLY_BYPASS: ${FRACTO_ADMIN_READONLY_BYPASS:-false}
      FRACTO_ADMIN_CHAT_LAB_BYPASS: ${FRACTO_ADMIN_CHAT_LAB_BYPASS:-false}
      FRACTO_OIDC_ISSUER: ${FRACTO_OIDC_ISSUER:-}
      FRACTO_OIDC_CLIENT_ID: ${FRACTO_OIDC_CLIENT_ID:-}
      FRACTO_OIDC_CLIENT_SECRET: ${FRACTO_OIDC_CLIENT_SECRET:-}
      FRACTO_OIDC_REDIRECT_URI: ${FRACTO_OIDC_REDIRECT_URI:-}
      FRACTO_UI_ORIGIN: ${FRACTO_UI_ORIGIN:-http://localhost:3006}
      FRACTO_AUTH_SECURE_COOKIES: ${FRACTO_AUTH_SECURE_COOKIES:-false}
      FRACTO_BOOTSTRAP_ADMIN_CONFIRM: ${FRACTO_BOOTSTRAP_ADMIN_CONFIRM:-}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3004:3004"
      - "127.0.0.1:3005:3005"
      - "127.0.0.1:3006:3006"
      - "127.0.0.1:3007:3007"
      # Override only with the intended lab interface; peer TLS is never public nginx.
      - "${FRACTO_AI_PEER_BIND_ADDRESS:-127.0.0.1}:3447:3447"
    volumes:
      - ./config:/app/config:ro
      - fracto-tile-data:/var/lib/fracto/tiles
      - fracto-ai-data:/var/lib/fracto/ai
      - fracto-data-corrections:/var/lib/fracto/data-corrections
      - fracto-tile-index:/var/lib/fracto/index
      - fracto-assets:/app/assets
      - fracto-videos:/app/videos
      - fracto-logs:/app/logs
      - ./servers/fracto-tiles-server/benchmarks:/app/servers/fracto-tiles-server/benchmarks
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  index-refresh:
    image: fracto:local
    profiles: ["maintenance"]
    command: ["node", "scripts/run_logged.js", "index-refresh", "node", "--max-old-space-size=16384", "scripts/refresh_tile_index.js"]
    volumes:
      - ./config:/app/config:ro
      - fracto-tile-index:/var/lib/fracto/index
      - fracto-logs:/app/logs
    restart: "no"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  tile-cache-migrate:
    image: fracto:local
    profiles: ["maintenance"]
    command: ["node", "scripts/run_logged.js", "tile-cache-migrate", "node", "scripts/migrate_tile_cache_index.js", "/legacy-tiles", "/var/lib/fracto/tiles"]
    environment:
      FRACTO_TILE_INDEX_DIR: /var/lib/fracto/index
      FRACTO_MIGRATION_CONCURRENCY: ${FRACTO_MIGRATION_CONCURRENCY:-8}
    volumes:
      - ./tiles:/legacy-tiles
      - fracto-tile-data:/var/lib/fracto/tiles
      - fracto-tile-index:/var/lib/fracto/index:ro
      - fracto-logs:/app/logs
    restart: "no"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  database-init:
    image: fracto:local
    profiles: ["maintenance"]
    command: ["node", "scripts/run_logged.js", "database-init", "node", "scripts/initialize_database.js"]
    environment:
      FRACTO_MYSQL_HOST: ${FRACTO_MYSQL_HOST:-host.docker.internal}
      FRACTO_MYSQL_PORT: ${FRACTO_MYSQL_PORT:-3306}
      FRACTO_MYSQL_DATABASE: ${FRACTO_MYSQL_DATABASE:-fracto}
    volumes:
      - ./config:/app/config:ro
      - ./backup:/app/backup:ro
      - ./database/migrations:/app/database/migrations:ro
      - fracto-logs:/app/logs
    restart: "no"
    logging:
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  fracto-ai-data:
  fracto-data-corrections:
  fracto-tile-data:
  fracto-tile-index:
  fracto-assets:
  fracto-logs:
  fracto-videos:
