services:
  fracto-dev:
    build:
      context: .
      target: development
    image: fracto:dev
    environment:
      FRACTO_SERVER_NAME: ${FRACTO_SERVER_NAME:-}
      FRACTO_AI_ENGINE: ${FRACTO_AI_ENGINE:-ollama}
      FRACTO_AI_DATA_DIR: /var/lib/fracto/ai
      FRACTO_DATA_CORRECTION_DIR: /var/lib/fracto/data-corrections
      FRACTO_AI_PEERS_ENABLED: ${FRACTO_AI_PEERS_ENABLED:-true}
      FRACTO_AI_PEER_LISTEN_HOST: "0.0.0.0"
      FRACTO_AI_PEER_PORT: "3547"
      FRACTO_AI_LISTEN_HOST: "0.0.0.0"
      FRACTO_AI_MIN_FREE_MEMORY_MIB: ${FRACTO_AI_MIN_FREE_MEMORY_MIB:-6144}
      FRACTO_AI_MIN_FREE_DISK_MIB: ${FRACTO_AI_MIN_FREE_DISK_MIB:-1024}
      FRACTO_AI_MODEL: ${FRACTO_AI_MODEL:-}
      FRACTO_OLLAMA_URL: ${FRACTO_OLLAMA_URL:-http://host.docker.internal:11434}
      FRACTO_OLLAMA_ALLOW_HOST_GATEWAY: "true"
      FRACTO_SURVEY_MAX_GRID_SIZE: ${FRACTO_SURVEY_MAX_GRID_SIZE:-1024}
      FRACTO_SURVEY_MAX_CANVAS_SIZE: ${FRACTO_SURVEY_MAX_CANVAS_SIZE:-16384}
      FRACTO_UI_MODE: vite
      FRACTO_WATCH: "true"
      FRACTO_TILE_CACHE_READ_ONLY: "true"
      FRACTO_MYSQL_HOST: host.docker.internal
      FRACTO_MYSQL_PORT: "3306"
      FRACTO_SOCIAL_SYNC_TTL_MS: ${FRACTO_SOCIAL_SYNC_TTL_MS:-86400000}
      FRACTO_AUTH_MODE: ${FRACTO_AUTH_MODE:-oidc}
      FRACTO_AUTH_REQUIRED: ${FRACTO_AUTH_REQUIRED:-false}
      FRACTO_INTERNAL_SERVICE_TOKEN: ${FRACTO_INTERNAL_SERVICE_TOKEN:-}
      FRACTO_ADMIN_READONLY_BYPASS: ${FRACTO_ADMIN_READONLY_BYPASS:-false}
      FRACTO_OIDC_ISSUER: ${FRACTO_OIDC_ISSUER:-}
      FRACTO_OIDC_CLIENT_ID: ${FRACTO_OIDC_CLIENT_ID:-}
      FRACTO_OIDC_CLIENT_SECRET: ${FRACTO_OIDC_CLIENT_SECRET:-}
      FRACTO_OIDC_REDIRECT_URI: ${FRACTO_OIDC_REDIRECT_URI:-}
      FRACTO_UI_ORIGIN: ${FRACTO_UI_ORIGIN:-http://localhost:3106}
      FRACTO_AUTH_SECURE_COOKIES: ${FRACTO_AUTH_SECURE_COOKIES:-false}
      FRACTO_BOOTSTRAP_ADMIN_CONFIRM: ${FRACTO_BOOTSTRAP_ADMIN_CONFIRM:-}
      FRACTO_SERVER_PORT: 3101
      FRACTO_DATA_PORT: 3102
      FRACTO_ASSET_PORT: 3103
      FRACTO_TILES_PORT: 3104
      FRACTO_ADMIN_PORT: 3105
      FRACTO_UI_PORT: 3106
      FRACTO_AI_PORT: 3107
      VITE_FRACTO_SERVER_PORT: 3101
      VITE_FRACTO_DATA_PORT: 3102
      VITE_FRACTO_ASSET_PORT: 3103
      VITE_FRACTO_TILES_PORT: 3104
      VITE_FRACTO_ADMIN_PORT: 3105
      VITE_FRACTO_UI_PORT: 3106
    command: ["node", "--watch", "--max-old-space-size=16384", "index.js"]
    ports:
      - "3101:3101"
      - "3102:3102"
      - "3103:3103"
      - "3104:3104"
      - "3105:3105"
      - "3106:3106"
      - "127.0.0.1:3107:3107"
      - "${FRACTO_AI_DEV_PEER_BIND_ADDRESS:-127.0.0.1}:3547:3547"
    volumes:
      - ./.git:/app/.git:ro
      - ./config:/app/config:ro
      - ./constants.js:/app/constants.js:ro
      - ./index.js:/app/index.js:ro
      - ./utils.js:/app/utils.js:ro
      - ./utils:/app/utils:ro
      - ./handlers:/app/handlers:ro
      - ./scripts:/app/scripts:ro
      - ./sdk:/app/sdk:ro
      - ./social:/app/social
      - ./servers/fracto-admin-server:/app/servers/fracto-admin-server
      - /app/servers/fracto-admin-server/node_modules
      - ./servers/fracto-ai-server:/app/servers/fracto-ai-server
      - /app/servers/fracto-ai-server/node_modules
      - ./servers/fracto-asset-server:/app/servers/fracto-asset-server
      - /app/servers/fracto-asset-server/node_modules
      - ./servers/fracto-data-server:/app/servers/fracto-data-server
      - /app/servers/fracto-data-server/node_modules
      - ./servers/fracto-tiles-server:/app/servers/fracto-tiles-server
      - /app/servers/fracto-tiles-server/node_modules
      - ./servers/fracto-ui:/app/servers/fracto-ui
      - /app/servers/fracto-ui/node_modules
      # Numerical cache writes remain disabled by FRACTO_TILE_CACHE_READ_ONLY;
      # the meshes subtree on this same volume must be writable.
      - fracto-tile-data:/var/lib/fracto/tiles
      - fracto-dev-ai-data:/var/lib/fracto/ai
      - fracto-dev-data-corrections:/var/lib/fracto/data-corrections
      - fracto-tile-index:/var/lib/fracto/index:ro
      - fracto-dev-assets:/app/assets
      - fracto-dev-videos:/app/videos
      - fracto-dev-logs:/app/logs
      - ./servers/fracto-tiles-server/benchmarks:/app/servers/fracto-tiles-server/benchmarks
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  fracto-dev-ai-data:
  fracto-dev-data-corrections:
  fracto-dev-assets:
  fracto-dev-logs:
  fracto-dev-videos:
